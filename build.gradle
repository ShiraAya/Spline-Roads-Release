plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.sora.splineroads'
version = '2.1.2-fix4'
base { archivesName = 'splineroads' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets {
    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath = output + main.output + main.runtimeClasspath
    }
    validation {
        java.setSrcDirs(['src/validation/java'])
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
}
tasks.register('validateFix1', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.Feedback212Core'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix1/world/data/splineroads.dat'
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}
tasks.register('validateFix2', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.FeedbackFix2Core'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix2/world/data/splineroads.dat'
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}
tasks.register('inspectFix2', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.FeedbackFix2Inspect'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix2/world/data/splineroads.dat'
    if (project.hasProperty('feedbackRailCompare')) args project.property('feedbackRailCompare')
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}
tasks.register('inspectFix4', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.FeedbackFix4Inspect'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix4/world/data/splineroads.dat'
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}
tasks.register('validateFix4', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.FeedbackFix4Core'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix4/world/data/splineroads.dat'
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}
tasks.register('validateFix4Saved', JavaExec) {
    dependsOn validationClasses
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'com.sora.splineroads.world.FeedbackFix4Saved'
    args project.findProperty('feedbackWorld') ?: 'F:/SR-feedback-2.1.2-fix4/world/data/splineroads.dat'
    jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(project.findProperty('roadRunDir') ?: 'run')
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('roadMtr') || project.hasProperty('roadEmbeddiumDir') || project.hasProperty('roadOculusDir')) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', project.layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            }
            mods { splineroads { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('feedbackFix4Client')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix4Client', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedbackFix3Client')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix3Client', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedbackFix2Client')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix2Client', 'true'
                if (project.hasProperty('feedbackFix2Rail')) property 'road.feedbackFix2Rail', 'true'
                if (project.hasProperty('feedbackFix2RailUpdated')) property 'road.feedbackFix2RailUpdated', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedback212Client')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedback212Client', 'true'
                if (project.hasProperty('feedback212CutVisual')) property 'road.feedback212CutVisual', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
        }
        server {
            args '--nogui'
            if (project.hasProperty('feedbackFix4')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix4', 'true'
                if (project.hasProperty('feedbackFix4Edit')) property 'road.feedbackFix4Edit', 'true'
                if (project.hasProperty('feedbackFix4Resume')) property 'road.feedbackFix4Resume', project.property('feedbackFix4Resume')
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedbackFix3')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix3', 'true'
                if (project.hasProperty('feedbackFix3Safety')) property 'road.feedbackFix3Safety', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedbackFix2')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix2', 'true'
                if (project.hasProperty('feedbackFix2RailWorld')) property 'road.feedbackFix2RailWorld', 'true'
                if (project.hasProperty('feedbackFix2Geometry')) property 'road.feedbackFix2Geometry', 'true'
                if (project.hasProperty('feedbackFix2Scenes')) property 'road.feedbackFix2Scenes', 'true'
                if (project.hasProperty('feedbackFix2Profile')) {
                    property 'road.feedbackFix2OnlySlow', 'true'
                    jvmArgs '-XX:StartFlightRecording=settings=profile,dumponexit=true,filename=feedback-fix2.jfr'
                }
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
            if (project.hasProperty('feedbackFix1')) {
                mods { splineroads { source sourceSets.gameTest } }
                property 'road.feedbackFix1', 'true'
                if (project.hasProperty('feedback212Edit')) property 'road.feedback212Edit', 'true'
                if (project.hasProperty('feedback212Reload')) property 'road.feedback212Reload', 'true'
                if (project.hasProperty('feedback212Cuts')) property 'road.feedback212Cuts', 'true'
                jvmArgs '-Xmx6G', '-XX:ActiveProcessorCount=4'
            }
        }
    }
}

repositories {
    if (project.hasProperty('roadMtrRepository')) maven {
        url = uri(project.property('roadMtrRepository'))
        content { includeModule 'maven.modrinth', 'minecraft-transit-railway' }
    }
    // Optional isolated mirror of the same pinned official artifacts, for reproducible offline tests.

    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    if (project.hasProperty('roadEmbeddiumDir')) flatDir { dirs project.property('roadEmbeddiumDir') }
    if (project.hasProperty('roadOculusDir')) flatDir { dirs project.property('roadOculusDir') }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    // Optional MTR 4.0.5 adapter; never bundle the mod or link it on the absent path.
    if (project.hasProperty('roadMtrJar')) compileOnly files(project.property('roadMtrJar'))
    else compileOnly 'maven.modrinth:minecraft-transit-railway:R05lh1Ys'
    if (project.hasProperty('roadMtr')) runtimeOnly fg.deobf('maven.modrinth:minecraft-transit-railway:R05lh1Ys')
    if (project.hasProperty('roadEmbeddiumDir')) runtimeOnly fg.deobf('org.embeddedt:embeddium:0.3.31+mc1.20.1')
    if (project.hasProperty('roadOculusDir')) runtimeOnly fg.deobf('net.coderbot:oculus:1.8.0')
}

tasks.named('jar', Jar) {
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from('THIRD_PARTY_LICENSES') { into 'META-INF/licenses' }
    manifest { attributes 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
